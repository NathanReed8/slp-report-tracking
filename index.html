<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Progress Report Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">LOCAL CLIENT MANAGEMENT</p>
        <h1>Client progress report tracker</h1>
        <p class="subtitle">Keep an eye on which progress reports are due next.</p>
      </div>
      <button id="add-token-button" class="primary-button" type="button">+ Add client</button>
    </header>

    <section class="card" aria-labelledby="token-list-heading">
      <div class="card-heading">
        <h2 id="token-list-heading">Your clients</h2>
        <span id="token-count" class="token-count">0 clients</span>
      </div>
      <div id="empty-state" class="empty-state">No clients added yet. Add one to start tracking progress report due dates.</div>
      <div id="table-wrap" class="table-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th><button class="sort-button" data-sort="name" type="button">Client <span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th><button class="sort-button" data-sort="expiryDate" type="button">Next progress report <span class="sort-indicator" aria-hidden="true"></span></button></th>
              <th><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="token-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="token-dialog" aria-labelledby="dialog-title">
    <form id="token-form" method="dialog">
      <div class="dialog-header"><div><p class="eyebrow">NEW CLIENT</p><h2 id="dialog-title">Add a client</h2></div><button id="close-dialog" class="icon-button" type="button" aria-label="Close">×</button></div>
      <label>Client name<input id="token-name" required autocomplete="off" placeholder="e.g. Acme Corporation" /></label>
      <label>Client start date<input id="creation-date" type="date" required /></label>
      <label>Progress report due in<div class="duration-row"><input id="duration" type="number" min="1" step="1" value="90" required /><select id="duration-unit"><option value="days">days</option><option value="weeks">weeks</option><option value="months">months</option></select></div></label>
      <p id="form-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="cancel-dialog" class="secondary-button" type="button">Cancel</button><button class="primary-button" type="submit">Add client</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-dialog-title">
    <form id="delete-form" method="dialog">
      <div class="dialog-header"><div><p class="eyebrow">REMOVE CLIENT</p><h2 id="delete-dialog-title">Delete client?</h2></div><button id="close-delete-dialog" class="icon-button" type="button" aria-label="Close">×</button></div>
      <p id="delete-message" class="delete-message"></p>
      <div class="dialog-actions"><button id="cancel-delete" class="secondary-button" type="button">Cancel</button><button id="confirm-delete" class="danger-button" type="submit">Delete client</button></div>
    </form>
  </dialog>
  <script src="date-utils.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
