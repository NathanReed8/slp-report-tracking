name: Test and release desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    name: Build Windows installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    env:
      WINDOWS_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure Windows signing when credentials are available
        if: env.WINDOWS_CSC_LINK != ''
        shell: pwsh
        run: |
          "WIN_CSC_LINK=$env:WINDOWS_CSC_LINK" | Add-Content -Path $env:GITHUB_ENV
          "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_CSC_KEY_PASSWORD" | Add-Content -Path $env:GITHUB_ENV
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  build-macos:
    name: Build universal macOS installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    env:
      MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
      MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Configure macOS signing when credentials are available
        if: env.MAC_CSC_LINK != ''
        shell: bash
        run: |
          echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_ID=$MAC_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$MAC_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$MAC_APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: version
        name: Read release version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Download

            - **Windows:** [Download the Windows installer (.exe)](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/SLP-Report-Tracking-${{ steps.version.outputs.version }}-win-x64.exe)
            - **Mac:** [Download the Mac installer (.dmg)](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/SLP-Report-Tracking-${{ steps.version.outputs.version }}-mac-universal.dmg)

            The other files support automatic updates and can be ignored for a first-time installation.
          files: release-assets/*
